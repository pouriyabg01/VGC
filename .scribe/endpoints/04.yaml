        The games the site puts on. Reading is public; only an admin can change the
        catalogue.
      subgroup: ''
      subgroupDescription: ''
      title: 'Vote for a game, or take the vote back'
      description: |-
        A vote is a person, not a click: the pivot is unique on (game, user), so
        calling this again removes the vote rather than counting it twice.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
